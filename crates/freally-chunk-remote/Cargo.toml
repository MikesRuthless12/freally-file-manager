[package]
name = "freally-chunk-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 50g — remote and cached BlobBackend implementations for the CDR chunk store."
publish.workspace = true

[dependencies]
# The `BlobBackend` trait and the store's error type live here.
freally-chunk = { path = "../freally-chunk", version = "0.22" }
# Reuses the Phase 32 backend config + `make_operator` so a repository
# backend is configured exactly like a cloud remote, rather than
# growing a second, divergent credential surface.
freally-cloud = { path = "../freally-cloud", version = "0.22" }
opendal = { version = "0.54", default-features = false }
# `BlobBackend` is synchronous; OpenDAL is async. A dedicated runtime
# owned by the backend bridges the two — see the module docs.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
