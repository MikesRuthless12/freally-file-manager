[package]
name = "freally-mergeview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 53 — 3-way merge previews for non-text files."
publish.workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Already in-tree via Phase 22 thumbnails.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
psd = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "isomp4", "aac"] }
mp4 = "0.14"
pdf = "0.9"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
