[package]
name = "freally-collab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 51 — end-to-end encrypted collaboration: member roster, envelope crypto, signed revocation, SAS verification."
publish.workspace = true

[dependencies]
# Phase 51 rides the Phase 47 crypt pipeline rather than calling `age`
# directly, so both encryption paths share one audited seam. The
# roster's recipients are exactly `freally_crypt::Recipient::X25519`.
freally-crypt = { path = "../freally-crypt", version = "0.22" }
# `age::x25519` for generating and parsing member keypairs, and for the
# raw public-key bytes the SAS is derived from.
age = { version = "0.11", default-features = false }
# Revocation tokens are signed statements — age encrypts but does not
# sign, so the roster carries an ed25519 admin key. Already in the tree.
ed25519-dalek = { version = "2", default-features = false, features = [
    "std",
    "zeroize",
] }
# SAS derivation + roster fingerprints.
blake3 = "1"
# Roster persistence.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Seed material for the admin signing key. Matches freally-cloud's major.
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
